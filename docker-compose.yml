# ──────────────────────────────────────────────────────────────────────────────
# DevFlow — Docker Compose
#
# Starts the Next.js frontend alongside a placeholder for the FastAPI backend.
# In a full monorepo setup the backend service would point to its own build
# context; update the `api` service below to match your backend setup.
#
# Usage:
#   docker-compose up --build          # build & start all services
#   docker-compose up frontend         # start only the frontend
#   docker-compose down                # stop and remove containers
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time env vars baked into the client bundle.
        # For staging/prod, override via CI environment variables.
        NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        # Inside Docker, the frontend talks to the `api` service by its
        # service name on the shared network.
        NEXT_PUBLIC_API_URL: "http://api:8000"
        NEXT_PUBLIC_WS_URL: "ws://api:8000"
    container_name: devflow-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      - api
    networks:
      - devflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  # Replace this stub with the real backend build context once the backend
  # repo is co-located or available as a pre-built image.
  api:
    # image: devflow-api:latest           # use a pre-built image, OR
    # build:                              # build from a sibling directory:
    #   context: ../devflow-backend
    #   dockerfile: Dockerfile
    image: python:3.12-alpine             # placeholder — keeps compose valid
    container_name: devflow-api
    command: >
      sh -c "echo 'Replace this with the real DevFlow backend service' && sleep infinity"
    ports:
      - "8000:8000"
    environment:
      # Add your backend env vars here (database URL, secret key, etc.)
      # Use a .env file or Docker secrets for sensitive values — never hardcode.
      PYTHONUNBUFFERED: "1"
    networks:
      - devflow
    restart: unless-stopped

networks:
  devflow:
    driver: bridge
